# The Postgres behind `yarn accounts:start`, and so behind `yarn dev` and `yarn e2e`.
# `yarn db:start` brings it up and waits for it to answer; the data survives
# restarts in the named volume, which is the point of having a database at all
# (see docs/adr/0001-postgres-and-drizzle-behind-the-api.md).
#
# The credentials are the ones DATABASE_URL in .env.example spells out. CI does
# not read this file: the e2e job declares the same service in ci.yml.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frontend_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The Lighthouse CI server: the dashboard `yarn lighthouse` uploads to, which
  # keeps every run and compares a branch against main
  # (lighthouse/lighthouserc.yml). `yarn lhci:start` brings it up, waits for it
  # and pulls in what CI ran since last time (lighthouse/pull.ts);
  # `yarn db:start` does not, because nothing else needs it.
  #
  # The image is published for amd64 only, so it runs emulated on Apple
  # silicon; `platform` says so rather than letting Docker warn on every start.
  # The version matches @lhci/cli in package.json, which is the client that
  # talks to it.
  lhci:
    image: patrickhulce/lhci-server:0.15.1
    platform: linux/amd64
    ports:
      - "9001:9001"
    volumes:
      - lhci-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9001/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # The Datadog Agent, which both backend services send their traces and logs
  # to, and which forwards them to Datadog beside the browser's RUM. `yarn datadog:start`
  # brings it up; `yarn start` does not, because it cannot start without an API
  # key and the demo has to run for someone who has none.
  #
  # Two doors, one per service, because they reach it by different roads
  # (docs/adr/0008): 8126 is dd-trace's, from the notifications service, and
  # 4318 is OTLP over HTTP, from the account API's OpenTelemetry. Neither
  # service sends anything unless DD_AGENT_HOST is set (.env.example).
  #
  # The key and the site are read from the repository's .env, which Compose
  # loads on its own: the same DATADOG_API_KEY the source-map upload uses, and
  # the site the browser SDK reports to, so the traces land beside the RUM
  # sessions they belong to.
  datadog-agent:
    image: datadog/agent:7
    environment:
      DD_API_KEY: ${DATADOG_API_KEY}
      DD_SITE: ${VITE_DATADOG_SITE:-datadoghq.com}
      # Docker Desktop hides the machine's name from the container, and the
      # Agent refuses to start without one.
      DD_HOSTNAME: local-dev
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      # Playwright's webServer polls /health on both services until they
      # answer, and every poll would otherwise be a trace. Dropped here, once,
      # for both - the job Sentry's samplers do in each service.
      DD_APM_IGNORE_RESOURCES: GET /health
      # Logs, by the same two roads as the traces: the account API's over OTLP,
      # the notifications service's on the UDP port its config below opens.
      DD_LOGS_ENABLED: "true"
      DD_OTLP_CONFIG_LOGS_ENABLED: "true"
      # No metrics. The host metrics the Agent would report are this laptop's.
      DD_ENABLE_PAYLOADS_EVENTS: "false"
      DD_ENABLE_PAYLOADS_SERIES: "false"
      DD_ENABLE_PAYLOADS_SERVICE_CHECKS: "false"
      DD_ENABLE_PAYLOADS_SKETCHES: "false"
      DD_PROCESS_AGENT_ENABLED: "false"
    volumes:
      - ./server/Notifications/datadog-logs.yaml:/etc/datadog-agent/conf.d/notifications.d/conf.yaml:ro
    ports:
      - "8126:8126"
      - "4318:4318"
      - "10518:10518/udp"
    healthcheck:
      test: ["CMD", "agent", "health"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Datadog Synthetics' private location: a worker that polls Datadog for its
  # tests and runs them from this machine, against the builds `yarn preview`
  # serves. `yarn synthetics:start` brings it up, once the location exists in
  # Datadog and its config is saved where this mounts it (synthetics/README.md);
  # nothing else starts it, for the same reason as the Agent.
  #
  # The tests name `http://localhost:4173`, and the shell's bundle names its
  # remotes on localhost:4174 and :4175 (federation.config.ts). Inside a
  # container, localhost is the container, so this sidecar forwards those three
  # ports to the host and the worker shares its network: the same URLs then work
  # here and through datadog-ci's tunnel, which resolves them on this machine.
  # The previews listen on 127.0.0.1 for this (vite.base.ts's `previewHost`).
  synthetics-localhost:
    image: alpine/socat:1.8.0.3
    entrypoint: /bin/sh
    command:
      - -c
      - for port in 4173 4174 4175; do socat TCP-LISTEN:$$port,fork,reuseaddr TCP:host.docker.internal:$$port & done; wait
    # Docker Desktop defines host.docker.internal on its own; Linux needs this.
    extra_hosts:
      - host.docker.internal:host-gateway

  # Published for amd64 only, so it runs emulated on Apple silicon, like lhci.
  # The version is pinned: an unpinned worker upgrades itself under the tests.
  synthetics-private-location:
    image: datadog/synthetics-private-location-worker:1.73.0
    platform: linux/amd64
    network_mode: service:synthetics-localhost
    depends_on:
      - synthetics-localhost
    environment:
      # The location's config only lets it fetch tests and post results. The
      # screenshots and artifacts of a browser run are uploaded separately, with
      # an API key - the same one as the Agent's, from the repository's .env.
      DATADOG_API_KEY: ${DATADOG_API_KEY}
      # Serves http://127.0.0.1:8080/liveness for the healthcheck below.
      DATADOG_WORKER_ENABLE_STATUS_PROBES: "true"
    volumes:
      # Long form so a missing config is an error, not an empty directory
      # Docker would create at that path.
      - type: bind
        source: ./synthetics/.private-location.json
        target: /etc/datadog/synthetics-check-runner.json
        read_only: true
        bind:
          create_host_path: false
    # The worker's own liveness probe, rather than the /tmp/liveness.date file
    # older docs check: this version no longer writes it. Node because the
    # image has no curl.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/liveness').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
  lhci-data:
