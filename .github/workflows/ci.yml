# The gate from README.md and AGENTS.md, run on every PR and on main:
# `yarn verify && yarn test`, plus `yarn e2e` because the e2e suite is the only
# tier that crosses the wire to the real API process.
#
# Three jobs rather than one so a lint failure shows up in seconds instead of
# after a Chromium install, and so each tier's log is its own thing to read.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (oxlint, oxfmt, tsc)
    runs-on: ubuntu-latest
    # The whole job is a minute or two; a hang is the runner, not the code.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      # `yarn verify` ends on `dotnet build`: the API is .NET (server/), and
      # global.json is its .nvmrc.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: yarn install --frozen-lockfile
      - run: yarn verify

  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    # The whole job is a minute or two; a hang is the runner, not the code.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: yarn install --frozen-lockfile
      # Chromium is ~150 MB fetched fresh on every job, and it cost more than the
      # suite it exists for: 41s to install against 10s of tests here, 21s
      # against 9s in e2e. Cached on the lockfile hash, which is coarser than the
      # Playwright version alone — an unrelated bump re-downloads the browser —
      # but it is the only key that cannot go stale against the installed
      # `@playwright/test`. `browsers:install` still runs on a hit: it is
      # idempotent, and `--with-deps` installs OS packages the cache cannot hold.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      # The integration tier runs in a real Chromium through Vitest's
      # Playwright provider, so the browser has to exist before `yarn test`.
      - run: yarn browsers:install
      - run: yarn test
      # The API's own tests. They start a Postgres through Testcontainers, which
      # is why they run here, where the runner's Docker is, and not under
      # `yarn test`, whose Node tier has no service to lean on.
      - run: yarn server:test

  build:
    name: build (bundle + source maps + debug files)
    runs-on: ubuntu-latest
    # The whole job is a minute or two; a hang is the runner, not the code.
    timeout-minutes: 15
    # `verify` type-checks the app against tsconfig.app.json, which is the half
    # of `yarn build` that `tsc` does. This job runs the other half - the one
    # that actually bundles - because a StyleX or React Compiler failure only
    # shows up there, and nothing else in CI ever produced a dist/.
    #
    # The token is what turns the same command into a source-map upload: set, it
    # generates the maps, sends them to Sentry and deletes them; unset - which is
    # every pull request from a fork, since secrets are withheld there - the
    # build runs unchanged and emits no map at all. See apps/shell/vite.config.ts.
    #
    # All four are in the `build` task's `env` in turbo.json, which is what
    # keeps the cache honest: a cache hit skips the upload, so a token-bearing
    # build must never be served from a token-less entry. SENTRY_RELEASE being
    # the sha is the load-bearing part - it makes every commit's build hash
    # unique, so an upload can never be replayed from an earlier commit.
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # One Sentry project per remote (vite.base.ts, .env.example). Unset, a
      # remote's build reports into the shell's project instead; set, its maps
      # and its stamped DSN go to a project of its own.
      SENTRY_DSN_ACCOUNT: ${{ secrets.SENTRY_DSN_ACCOUNT }}
      SENTRY_DSN_HOME: ${{ secrets.SENTRY_DSN_HOME }}
      # WHICH BUILD this is, in one word for all five Sentry projects. The Vite
      # plugin would derive the same sha from git on its own; naming it here is
      # what makes the three frontend builds and the two backends agree on a
      # string rather than each deriving one of its own. A release is global to
      # the organisation and carries events from every project under it, so one
      # sha is what lets a deploy be compared across them.
      #
      # This reaches the BROWSER only, because Vite stamps it into each bundle
      # at build time. The two backend services read it from their own
      # environment at startup instead, which is a deployment's job and not
      # this job's - see .env.example.
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The plugin names the release after the commit it built, and reads
          # that from git. A shallow clone of depth 1 has the commit but not the
          # history, so the associated commits would be empty.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      # The API's Release build is the other half of this job: it hands Sentry
      # the PDBs and sources behind a .NET frame, on the same token.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Turborepo's task cache, carried BETWEEN runs - a fresh runner otherwise
      # has nothing and every build is cold. The win is a commit that touches
      # only server/, docs/ or evals/: the three Vite builds are then restored
      # rather than run, in both this job and e2e.
      #
      # Not a win WITHIN a run, and the key says so by including the job name:
      # `build` runs with the Sentry secrets set and `e2e` without them, those
      # variables are in the task's `env` in turbo.json, so the two jobs hash
      # differently on purpose. A token-bearing build must never be served from
      # a token-less entry.
      #
      # Keyed on the sha so every run writes its own entry, with a prefix
      # restore so it starts from the most recent one. What turbo does with it
      # is hash-based, not key-based: a restored entry is used only if the
      # task's own inputs and declared env match.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn server:build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # The whole job is a minute or two; a hang is the runner, not the code.
    timeout-minutes: 15
    # The API stores its accounts in Postgres (server/Accounts/AccountsDb.cs), so
    # this tier needs one. The same image and credentials as compose.yaml, declared here
    # rather than read from it because Actions has no `docker compose` service
    # runner; the health check makes the runner wait for it before checkout.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frontend_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=frontend_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      # Playwright starts the API with `yarn accounts:start`, which is `dotnet run`.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: yarn install --frozen-lockfile
      # Chromium is ~150 MB fetched fresh on every job, and it cost more than the
      # suite it exists for: 41s to install against 10s of tests here, 21s
      # against 9s in e2e. Cached on the lockfile hash, which is coarser than the
      # Playwright version alone — an unrelated bump re-downloads the browser —
      # but it is the only key that cannot go stale against the installed
      # `@playwright/test`. `browsers:install` still runs on a hit: it is
      # idempotent, and `--with-deps` installs OS packages the cache cannot hold.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      # Turborepo's task cache, carried BETWEEN runs - a fresh runner otherwise
      # has nothing and every build is cold. The win is a commit that touches
      # only server/, docs/ or evals/: the three Vite builds are then restored
      # rather than run, in both this job and e2e.
      #
      # Not a win WITHIN a run, and the key says so by including the job name:
      # `build` runs with the Sentry secrets set and `e2e` without them, those
      # variables are in the task's `env` in turbo.json, so the two jobs hash
      # differently on purpose. A token-bearing build must never be served from
      # a token-less entry.
      #
      # Keyed on the sha so every run writes its own entry, with a prefix
      # restore so it starts from the most recent one. What turbo does with it
      # is hash-based, not key-based: a restored entry is used only if the
      # task's own inputs and declared env match.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: yarn browsers:install
      # playwright.config.ts starts the API and the preview build itself
      # through `webServer`; with CI set it never reuses a stale server.
      - run: yarn e2e
      # `trace: on-first-retry` in playwright.config.ts writes traces to
      # test-results/; keep them when a run fails so the failure can be replayed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
