# The skill evals, run when the rules themselves change.
#
# `yarn verify && yarn test` in ci.yml checks the code. Nothing in it can check
# whether an agent still applies the ~75 rules no linter reaches — that is what
# this suite is for, and it only has an answer worth reading when a rule moved.
# So: the paths below, plus a manual button.
#
# Informative, not blocking. `evals/run.ts` prints the pass rate and exits zero
# whatever the score, so a red gate never stops a merge. A failing job here is a
# broken harness — a missing secret, a CLI that would not install — not a skill
# that regressed. Read the score in the run summary or in Langfuse.
name: Evals

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      # The suite is also under test when the suite itself changes.
      - "evals/**"
      - ".github/workflows/evals.yml"
  # Puts a "Run workflow" button in the Actions tab. It only appears once this
  # file is on the default branch.
  workflow_dispatch:
    inputs:
      gate:
        description: "Which skill to gate"
        required: false
        type: choice
        # A dropdown cannot be computed, so this list is the one place a gate is
        # named twice. `yarn evals --list-gates` is the source; a name that has
        # drifted out of it fails the run rather than scoring nothing. "all" is
        # every gate that has a task.
        options: ["all", "react", "javascript", "typescript"]
        default: "all"
      arm:
        description: "with-skills measures the repository as it stands, without-skills ablates the rules, both runs one job per arm"
        required: false
        type: choice
        options: ["both", "with-skills", "without-skills"]
        default: "both"
      repeat:
        description: "Trials per task. More samples, less noise, proportionally more money."
        required: false
        type: string
        default: "2"

# A new push supersedes the run already in flight: a trial costs real money, and
# the score of a commit that has been replaced is not worth paying for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A gate is named after a skill directory, so a pull request that touches one
  # skill can pay for one gate. Before this job existed, editing a single react
  # rule ran the javascript gate too — six trials and real money to score rules
  # nobody had changed.
  changes:
    name: which gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gates: ${{ steps.pick.outputs.gates }}
      arms: ${{ steps.pick.outputs.arms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Full history: the diff below needs a merge base with the target
          # branch, which a shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      - id: pick
        env:
          REQUESTED: ${{ inputs.gate }}
          REQUESTED_ARM: ${{ inputs.arm }}
          BASE: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          # Same reason as the gate step below: this one pipes through sed and
          # jq, and a broken pipe here would silently pick no gates at all.
          set -o pipefail

          all=$(yarn --silent evals --list-gates)
          # The two arm names are `ARMS` in `evals/run.ts`; one that has drifted
          # fails the run rather than scoring nothing.
          both='["with-skills","without-skills"]'

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # A manual run says what it wants: one gate or "all", one arm or "both".
            if [ "$REQUESTED" = "all" ]; then
              gates=$all
            else
              gates=$(jq -nc --arg gate "$REQUESTED" '[$gate]')
            fi
            if [ "$REQUESTED_ARM" = "both" ]; then
              arms=$both
            else
              arms=$(jq -nc --arg arm "$REQUESTED_ARM" '[$arm]')
            fi
          else
            changed=$(git diff --name-only "origin/$BASE...HEAD")

            # The harness, and the two files every agent in this repo reads,
            # can move any gate — there is no subset to narrow to — and they
            # reach both arms: the prompts and the pinned model live in
            # `evals/`, the CLI pin lives here, and the strip removes only the
            # Skills section of `AGENTS.md`. The baseline moved, so re-measure it.
            if echo "$changed" | grep -qE '^(AGENTS\.md|CLAUDE\.md|evals/|\.github/workflows/evals\.yml)'; then
              gates=$all
              arms=$both
            else
              touched=$(echo "$changed" \
                | sed -n 's|^\.claude/skills/\([^/]*\)/.*|\1|p' \
                | sort -u \
                | jq -Rsc 'split("\n") - [""]')
              # Intersection: a skill with no task is not a gate, and a gate
              # whose rules nobody touched has nothing new to say.
              gates=$(jq -nc --argjson all "$all" --argjson touched "$touched" '$all - ($all - $touched)')
              # A skill edit cannot move the ablation: `without-skills` strips
              # the skill before the agent starts, so that arm would re-measure
              # a constant and pay for it. It is the nightly's job to watch the
              # baseline drift; a pull request only asks whether the rule still
              # holds with the skill in place.
              arms='["with-skills"]'
            fi
          fi

          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "arms=$arms" >> "$GITHUB_OUTPUT"
          echo "Gates to run: \`$gates\`, arms: \`$arms\`" >> "$GITHUB_STEP_SUMMARY"

  evals:
    needs: changes
    # Nothing to score: a pull request that touched no skill under gate.
    if: needs.changes.outputs.gates != '[]'
    # One job per gate and arm, because one gate in one arm is one Langfuse
    # dataset run and one pass rate. Running them in parallel also keeps the wall
    # clock near the slowest job rather than the sum of all of them.
    name: ${{ matrix.gate }} ${{ matrix.arm }}
    runs-on: ubuntu-latest
    # The largest gate is five tasks, each repeated `repeat` times, at 1-4 minutes
    # a trial and three tasks abreast — and `claude -p` is given 15 minutes of
    # its own per trial. The 15-minute cap the other jobs use would kill this
    # one mid-suite.
    timeout-minutes: 90
    strategy:
      # One job's harness failure says nothing about the others, and their runs
      # are already paid for.
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.changes.outputs.gates) }}
        arm: ${{ fromJSON(needs.changes.outputs.arms) }}
    steps:
      # The branch under test, by name. On a pull request that is the head
      # branch, not the merge commit `actions/checkout` would pick by default:
      # the score belongs to a commit that exists, and HEAD stays attached, so
      # `run.ts` reads the real branch name for the run. Empty everywhere else,
      # which leaves the default — the branch a manual run was started from.
      # Shallow is enough: a worktree branches from HEAD with one commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      # Pinned like the model is: `run.ts` records the CLI version with every
      # score, and a version that moves on its own reads as a skill regression.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.258

      - name: Run gate
        env:
          # A subscription token from `claude setup-token`, not an API key: the
          # trials are billed to the plan, as the local ones are. Rate limits
          # apply per five-hour window, and a trial killed by one writes
          # `trial_error` rather than a score — read a burst of those as an
          # exhausted limit, not as a skill regression.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          REPEAT: ${{ inputs.repeat || '2' }}
          # Tasks at once within this job. Nobody reads the log while it runs,
          # so the interleaving `run.ts` defaults to one to avoid costs nothing
          # here; the wall clock does. Three, not five: every job in the matrix
          # draws on the same token, and this many `claude -p` across all of
          # them is already a burst.
          CONCURRENCY: "3"
        # The suite's own report is the summary: it already carries the pass
        # rate, the cost and the Langfuse run URL.
        run: |
          # Without this the job is green whatever happens: `bash -e` reads a
          # pipeline's status from its last command, which is `tee`, and `tee`
          # always succeeds. A Langfuse 409 that killed `run.ts` before the first
          # trial still reported success — the exact inversion of what this
          # workflow claims, where a red job means a broken harness. A red score
          # still exits zero, because `run.ts` decides that, not the shell.
          set -o pipefail

          {
            echo '## `${{ matrix.gate }}` · `${{ matrix.arm }}`'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          yarn evals --gate '${{ matrix.gate }}' --arm '${{ matrix.arm }}' --repeat "$REPEAT" --max-concurrency "$CONCURRENCY" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
